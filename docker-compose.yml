version: "3.9"

services:
  db:
    image: postgres:16
    container_name: restaurant_feedback_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    container_name: restaurant_feedback_bot
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    command: python -m app.main

volumes:
  postgres_data: